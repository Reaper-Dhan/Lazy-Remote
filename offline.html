<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lazy Remote</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/remote.css" />
</head>
<body class="offline-shell">
  <main class="pair-panel">
    <img src="/assets/logo.svg" alt="Lazy Remote" width="52" height="52" class="pair-mark" />
    <h1>Remote unavailable</h1>
    <p>Start Lazy Remote on the device you want to control. Connect it and your phone to the same network.</p>
    <p>If the address changed, open the new address in your browser.</p>
    <a class="btn btn-accent" href="/">Try again</a>
  </main>
</body>
</html>

name: Test and build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Third-party actions and images are pinned to full hashes, so a moved tag cannot
# change what runs here. The comment names the release each hash belongs to.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The Windows and Linux apps bundle these; the Mac app uses the system OpenSSL.
      - if: runner.os != 'macOS'
        run: python -m pip install cryptography==50.0.2 qrcode==8.2
      - name: Run the Python tests
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v test_platform test_remote 2>&1 | tee test-output.txt
      - name: Show test failures as annotations
        if: failure()
        shell: bash
        run: python .github/annotate_test_failures.py test-output.txt
      - if: runner.os == 'Linux'
        run: node --test test_remote_js.cjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Lazy-Remote-Windows
          - os: macos-latest
            artifact: Lazy-Remote-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        run: |
          python -m pip install -r packaging/requirements.txt
          python packaging/build_desktop.py
      - name: Verify HTTPS and pairing in the packed Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          unzip -q dist/Lazy-Remote-Windows.zip -d smoke
          python .github/smoke_package.py "smoke/Lazy Remote/Lazy Remote.exe" --server
      - if: runner.os == 'macOS'
        run: ./"Build Launcher.command"
      - name: Verify HTTPS and pairing in the packed Mac app
        if: runner.os == 'macOS'
        run: |
          mkdir smoke && ditto -x -k dist/Lazy-Remote-macOS.zip smoke
          server="smoke/Lazy Remote.app/Contents/Resources"
          python3 .github/smoke_package.py "$server/python/bin/python3" -E -s -B -u "$server/server/server.py"
          codesign --verify --deep --strict "smoke/Lazy Remote.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    # AlmaLinux 9 (glibc 2.34, supported to 2032): the app then runs on RHEL 9+,
    # Ubuntu 22.04+ and Debian 12+. Newer build hosts would raise that floor.
    container: almalinux:9@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2
    steps:
      - name: Install Python 3.12 with Tk
        run: dnf install -y --setopt=install_weak_deps=False python3.12 python3.12-pip python3.12-tkinter binutils tar gzip util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3.12 -c "import tkinter; print('Tk', tkinter.TkVersion)"
          ldd --version | head -1
      - run: |
          python3.12 -m venv /opt/build
          /opt/build/bin/python -m pip install -r packaging/requirements.txt
          /opt/build/bin/python packaging/build_desktop.py
      - name: Verify HTTPS and pairing in the packed Linux app
        run: |
          mkdir smoke && tar -xzf dist/Lazy-Remote-Linux-*.tar.gz -C smoke
          runuser -u nobody -- python3.12 .github/smoke_package.py smoke/lazy-remote/lazy-remote --server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lazy-Remote-Linux
          path: dist/*
          if-no-files-found: error

  build-iphone:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile the native iPhone Bluetooth preview
        run: >-
          xcodebuild -project "iphone/Lazy Remote.xcodeproj" -scheme "Lazy Remote"
          -sdk iphoneos -configuration Release -derivedDataPath "$RUNNER_TEMP/iphone-build"
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify native session recovery and lock races
        run: |
          swiftc -swift-version 5 -D DEBUG -parse-as-library iphone/RemoteConnection.swift test_iphone.swift -o "$RUNNER_TEMP/test-iphone"
          "$RUNNER_TEMP/test-iphone"
      - name: Verify Bluetooth write transactions
        run: |
          swiftc -swift-version 5 -parse-as-library BluetoothHost.swift test_bluetooth.swift -o "$RUNNER_TEMP/test-bluetooth"
          "$RUNNER_TEMP/test-bluetooth"

  build-android-tv:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Android SDK packages
        run: |
          sdk="$RUNNER_TEMP/lazy-android-sdk"
          stage="$RUNNER_TEMP/lazy-android-sdk-download"
          mkdir -p "$sdk/platforms" "$sdk/build-tools" "$stage"
          cd "$stage"
          curl --fail --silent --show-error --retry 3 -O https://dl.google.com/android/repository/platform-36_r02.zip
          curl --fail --silent --show-error --retry 3 -O https://dl.google.com/android/repository/build-tools_r35_linux.zip
          sha1sum --check <<'CHECKSUMS'
          2c1a80dd4d9f7d0e6dd336ec603d9b5c55a6f576  platform-36_r02.zip
          2cfaa0bbb2336e9ec18ed3ecea84fa2e2af607bc  build-tools_r35_linux.zip
          CHECKSUMS
          unzip -q platform-36_r02.zip -d platform
          unzip -q build-tools_r35_linux.zip -d tools
          mv platform/* "$sdk/platforms/android-36"
          mv tools/* "$sdk/build-tools/35.0.0"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Build and verify the Android TV preview
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          unset ANDROID_SDK_ROOT
          ./android-tv/gradlew -p android-tv :app:assembleDebug :app:lintDebug
          mkdir -p dist
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk dist/Lazy-Remote-Android-TV-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/Lazy-Remote-Android-TV-preview.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-TV-preview
          path: dist/Lazy-Remote-Android-TV-preview.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # signs the build attestation with this workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: Lazy-Remote-*
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum Lazy-Remote-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Proves each file was built by this workflow from this commit. Anyone can check
      # with: gh attestation verify <file> --repo Reaper-Dhan/Lazy-Remote
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Lazy-Remote-*
      - name: Publish the release with the three apps attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Lazy Remote $TAG" \
            --notes-file packaging/release-notes.md --verify-tag

name: Test and build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit hashes, so a moved tag cannot
# change what runs here. The comment names the release each hash belongs to.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The Windows and Linux apps bundle these; the Mac app uses the system OpenSSL.
      - if: runner.os != 'macOS'
        run: python -m pip install cryptography==50.0.2 qrcode==8.2
      - name: Run the Python tests
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v test_platform test_remote 2>&1 | tee test-output.txt
      - name: Show test failures as annotations
        if: failure()
        shell: bash
        run: python .github/annotate_test_failures.py test-output.txt
      - if: runner.os == 'Linux'
        run: node --test test_remote_js.cjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Lazy-Remote-Windows
          - os: ubuntu-22.04  # older glibc, so the binary runs on more distributions
            artifact: Lazy-Remote-Linux
          - os: macos-latest
            artifact: Lazy-Remote-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: runner.os != 'macOS'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - if: runner.os != 'macOS'
        run: |
          python -m pip install -r packaging/requirements.txt
          python packaging/build_desktop.py
      - if: runner.os == 'macOS'
        run: ./"Build Launcher.command"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum Lazy-Remote-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release with the three apps attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Lazy Remote $TAG" \
            --notes-file packaging/release-notes.md --verify-tag
